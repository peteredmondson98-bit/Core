<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Core</title>
<meta name="theme-color" content="#EEF1F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121735" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F8; --surface:#FFFFFF; --ink:#141933; --muted:#646A8A; --line:#D3D9E8; --track:#E1E5F0;
  --work:#2B44E6; --on-work:#FFFFFF; --rest:#D98200; --flame:#F29A00;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121735; --surface:#1B2148; --ink:#EEF0FB; --muted:#959BC2; --line:#2E3668; --track:#272E5E;
    --work:#8C99FF; --on-work:#121735; --rest:#FFC23D; --flame:#FFB020;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121735; --surface:#1B2148; --ink:#EEF0FB; --muted:#959BC2; --line:#2E3668; --track:#272E5E;
  --work:#8C99FF; --on-work:#121735; --rest:#FFC23D; --flame:#FFB020;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;transition:background-color .45s ease;
  -webkit-tap-highlight-color:transparent;
}
body.rest{background:color-mix(in srgb,var(--rest) 15%,var(--bg))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--work);outline-offset:3px}

.screen{height:100%;max-width:460px;margin:0 auto;animation:enter .4s cubic-bezier(.2,.8,.2,1) both}
.screen[hidden]{display:none}
@keyframes enter{from{opacity:0;transform:translateY(10px)}}

/* ---------- Home ---------- */
.home{overflow-y:auto;padding:20px 22px 22px;display:flex;flex-direction:column;gap:18px}
.home>*{flex-shrink:0}
.home>.push{margin-top:auto}
.masthead{display:flex;justify-content:space-between;align-items:center}
.mast-right{display:flex;align-items:center;gap:4px}
.menu-wrap{position:relative}
.more{width:36px;height:36px;border-radius:50%;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0;margin-right:-8px;transition:background-color .2s,color .2s}
.more svg{width:20px;height:20px}
.more:hover,.more[aria-expanded="true"]{background:var(--surface);color:var(--ink)}
.menu{position:absolute;top:calc(100% + 8px);right:-8px;z-index:5;min-width:230px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px;box-shadow:0 22px 44px -24px rgba(20,25,51,.45);transform-origin:top right;animation:menu .18s cubic-bezier(.2,.8,.2,1) both}
.menu[hidden]{display:none}
@keyframes menu{from{opacity:0;transform:scale(.96) translateY(-4px)}}
.menu button{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:none;border:0;border-radius:11px;padding:10px 12px}
.menu button:hover:not(:disabled){background:var(--bg)}
.menu button:disabled{cursor:default}
.menu button:disabled .t{color:var(--muted)}
.menu .t{font-weight:620}
.menu .s{color:var(--muted);font-size:.85rem;line-height:1.35}
.wordmark{font-size:1.35rem;font-weight:780;letter-spacing:-.02em;margin:0}
.today{color:var(--muted);font-size:.98rem}

.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:8px 2px 0}
.streak-num{display:flex;align-items:flex-start;font-size:clamp(6rem,30vw,8.5rem);font-weight:780;line-height:.82;letter-spacing:-.065em;font-variant-numeric:tabular-nums;font-variation-settings:"opsz" 96}
.streak-num span{display:inline-block;transform-origin:50% 80%}
.streak-num span.bump{animation:bump .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{40%{transform:scale(1.12)}}
.flame{width:.3em;height:.3em;margin:.02em 0 0 .06em;fill:var(--track);transition:fill .3s}
.flame.lit{fill:var(--flame)}
.streak-label{margin-top:10px;font-size:1.1rem;font-weight:600}
.nudge{margin:2px 0 0;color:var(--muted);font-size:1rem}
.hero-side{text-align:right;padding-bottom:4px}
.hero-side b{display:block;font-size:2rem;font-weight:720;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.hero-side span{color:var(--muted);font-size:.92rem}

.panel{background:var(--surface);border-radius:24px;padding:18px 18px 16px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 12px}
.panel-title{margin:0;font-size:1.05rem;font-weight:680}
.panel-meta{color:var(--muted);font-size:.92rem;font-variant-numeric:tabular-nums}

.heat{display:grid;gap:3px;font-size:.7rem;color:var(--muted)}
.heat-months,.heat-grid{display:grid;gap:3px}
.heat-grid{grid-auto-flow:column;grid-template-rows:repeat(7,auto)}
.heat-months span{white-space:nowrap;overflow:visible;line-height:1.2}
.heat-day{display:flex;align-items:center;line-height:1}
.cell{aspect-ratio:1;border-radius:4px;background:var(--track)}
.cell.l1{background:color-mix(in srgb,var(--work) 72%,var(--track))}
.cell.l2{background:var(--work)}
.cell.future{background:transparent}
.cell.today{box-shadow:0 0 0 1.5px var(--bg),0 0 0 3px var(--work)}
.cell.pop{animation:pop .9s cubic-bezier(.2,1.5,.4,1) .25s both}
@keyframes pop{0%{transform:scale(.2);background:var(--track)}55%{transform:scale(1.45)}100%{transform:scale(1)}}

.plan-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}
.plan-body.open{grid-template-rows:1fr}
.plan-inner{overflow:hidden}
.plan-list{list-style:none;margin:0;padding:0 18px}
.plan-list li{display:grid;grid-template-columns:20px 84px 1fr auto;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.plan-list .n{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.plan-list svg{width:84px;height:auto;display:block}
.plan-list .ex{font-weight:600}
.plan-list .dur{color:var(--muted);font-size:.92rem;font-variant-numeric:tabular-nums}
.plan-note{margin:0;padding:12px 18px 18px;border-top:1px solid var(--line);color:var(--muted);font-size:.92rem;line-height:1.45}

.mini line{stroke:var(--ink);stroke-linecap:round;fill:none}
.mini .limb{stroke-width:9}
.mini .torso{stroke-width:12}
.mini circle{fill:var(--ink)}
.mini .far{opacity:.32}
.mini .ground{stroke:var(--line);stroke-width:3}

.start:active{transform:scale(.98)}

/* ---------- Session ---------- */
.session{padding:16px 22px 20px;display:flex;flex-direction:column;gap:14px}
.session[hidden]{display:none}
.top{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:1rem}
.top .spacer{flex:1}
.close{height:40px;min-width:40px;border-radius:20px;border:1.5px solid var(--line);background:transparent;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 9px;transition:background-color .2s,color .2s,border-color .2s}
.close svg{width:18px;height:18px;flex:none}
.close span{display:none;font-size:.92rem;font-weight:600;padding-right:4px}
.close.armed{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.close.armed span{display:inline}
.total{font-variant-numeric:tabular-nums}
.total b{color:var(--ink);font-weight:650;font-size:1.3rem;margin-right:4px}

.segments{display:flex;gap:4px}
.seg{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.seg.break{margin-left:10px}
.seg i{display:block;height:100%;background:var(--work);transform-origin:left;transform:scaleX(0)}

.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:4px}
.phase{margin:0;font-size:.98rem;font-weight:600;color:var(--work);transition:color .3s}
body.rest .phase{color:var(--rest)}
body.paused .phase{color:var(--muted)}
.name{margin:0;font-size:clamp(1.8rem,7.6vw,2.45rem);line-height:1.05;font-weight:760;letter-spacing:-.02em;font-variation-settings:"opsz" 96}

.figure{width:100%;max-width:380px;height:auto;max-height:22vh;max-height:22dvh;margin:6px 0 4px;overflow:visible}
.figure line{stroke:var(--ink);stroke-linecap:round;fill:none}
.figure .limb{stroke-width:8}
.figure .torso{stroke-width:11}
.figure circle{fill:var(--ink)}
.figure .ground{stroke:var(--line);stroke-width:2}
.figure .far{opacity:.36}
.figure #person{transition:opacity .3s}
body.rest .figure #person{opacity:.55}

.clock{--size:min(64vw,33vh,290px);position:relative;width:var(--size);height:var(--size);flex:none}
.ring-track{fill:none;stroke:var(--track);stroke-width:5}
.ring-bar{fill:none;stroke:var(--work);stroke-width:5;stroke-linecap:round;stroke-dasharray:339.29;transition:stroke .35s}
body.rest .ring-bar{stroke:var(--rest)}
body.rest .num{color:var(--rest)}
.next{margin:6px 0 0;color:var(--muted);font-size:1.02rem;min-height:1.4em}

.controls{display:flex;justify-content:center;align-items:center;gap:30px}
.go{width:94px;height:94px;border-radius:50%;border:0;background:var(--work);color:var(--on-work);font-size:1.3rem;font-weight:720;box-shadow:0 12px 26px -12px var(--work);transition:transform .12s ease,background-color .2s,color .2s}
.go:active{transform:scale(.95)}
.go.stop{background:var(--ink);color:var(--bg);box-shadow:none}
.icon{width:54px;height:54px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;padding:0}
.icon svg{width:22px;height:22px}

@media (prefers-reduced-motion: reduce){
  .screen,.cell.pop,.streak-num span.bump{animation:none}
  body,.ring-bar,.phase,.figure #person,.plan-body,.wk-more{transition:none}
  .clock.beat .ring-bar,.tempo.beat i{animation:none}
}

/* ---------- Workout picker ---------- */
.picker{padding:8px}
.picker .panel-head{padding:10px 10px 0;margin-bottom:8px}
.wk{display:grid;grid-template-columns:1fr auto;align-items:center;border-radius:18px;transition:background-color .25s}
.wk + .wk{margin-top:4px}
.wk.sel{background:color-mix(in srgb,var(--work) 9%,var(--surface))}
.wk-pick{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:12px;text-align:left;background:none;border:0;padding:14px 4px 14px 12px;border-radius:18px;min-width:0}
.dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:border-color .2s}
.dot::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--work);transform:scale(0);transition:transform .25s cubic-bezier(.2,1.5,.4,1)}
.wk.sel .dot{border-color:var(--work)}
.wk.sel .dot::after{transform:scale(1)}
.wk-text{display:flex;flex-direction:column;gap:2px;min-width:0}
.wk-name{font-weight:680;font-size:1.05rem}
.wk-meta{color:var(--muted);font-size:.88rem;line-height:1.3}
.wk-time{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.wk-more{width:34px;height:34px;margin-right:10px;border-radius:50%;border:0;background:var(--bg);display:grid;place-items:center;padding:0;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.wk.sel .wk-more{background:var(--surface)}
.wk-more svg{width:16px;height:16px}
.wk-more[aria-expanded="true"]{transform:rotate(180deg)}
.wk .plan-body{grid-column:1 / -1}
.wk .plan-list{padding:0 12px}
.wk .plan-note{padding:12px 12px 14px}

.start{width:100%;height:66px;border:0;border-radius:20px;background:var(--work);color:var(--on-work);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 24px;font-size:1.15rem;font-weight:700;box-shadow:0 14px 30px -16px var(--work);transition:transform .12s ease}
.start span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.start-time{font-weight:500;opacity:.75;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Dial ---------- */
.clock svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.dial{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.num{font-size:calc(var(--size) * .46);font-weight:720;line-height:1;letter-spacing:-.05em;font-variant-numeric:tabular-nums;font-variation-settings:"opsz" 96}
.dial-side,.dial-sub{display:none;font-size:1rem;line-height:1.3;min-height:1.3em}
.clock.reps .num{font-size:calc(var(--size) * .4)}
.clock.reps .dial-side,.clock.reps .dial-sub{display:block}
.dial-side{color:var(--work);font-weight:680;margin-bottom:2px}
.dial-sub{color:var(--muted);margin-top:4px}
.clock.beat .ring-bar{animation:beat .32s ease-out}
@keyframes beat{0%{stroke-width:9}100%{stroke-width:5}}

.tempo{margin-top:2px;display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 14px 6px 12px;font-size:.9rem;font-weight:600}
.tempo[hidden]{display:none}
.tempo i{width:8px;height:8px;border-radius:50%;background:var(--track)}
.tempo[aria-pressed="true"]{color:var(--ink)}
.tempo[aria-pressed="true"] i{background:var(--work)}
.tempo.beat i{animation:tick .32s ease-out}
@keyframes tick{0%{transform:scale(1.9)}100%{transform:scale(1)}}

.clock.reps{--size:min(60vw,29vh,270px)}
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<main class="screen home" id="home">
  <header class="masthead">
    <h1 class="wordmark">Core</h1>
    <div class="mast-right">
      <div class="today" id="todayLabel"></div>
      <div class="menu-wrap">
        <button class="more" id="moreBtn" aria-label="More options" aria-haspopup="menu" aria-expanded="false" aria-controls="menu">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
        </button>
        <div class="menu" id="menu" role="menu" hidden>
          <button role="menuitem" id="exportBtn"><span class="t">Export history</span><span class="s" id="exportSub"></span></button>
          <button role="menuitem" id="importBtn"><span class="t">Import history</span><span class="s" id="importSub">Add days from an exported file</span></button>
          <input type="file" id="importFile" accept=".csv,text/csv,text/plain" hidden>
        </div>
      </div>
    </div>
  </header>

  <section class="hero" aria-label="Streak">
    <div>
      <div class="streak-num">
        <span id="streakNum">0</span>
        <svg class="flame" id="flame" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.6 1.5c.6 3.3 4.9 5.6 4.9 11a5.5 5.5 0 0 1-11 0c0-2.3 1.1-4 2.3-5.1-.1 2.2.9 3.5 2.2 3.6-.4-3.4-.6-6.4 1.6-9.5z"/></svg>
      </div>
      <div class="streak-label">day streak</div>
      <p class="nudge" id="nudge">Start a streak today</p>
    </div>
    <div class="hero-side">
      <b id="bestNum">0</b>
      <span>best streak</span>
    </div>
  </section>

  <section class="panel push" aria-labelledby="historyTitle">
    <div class="panel-head">
      <h2 class="panel-title" id="historyTitle">History</h2>
      <span class="panel-meta" id="historyMeta"></span>
    </div>
    <div class="heat" id="heat" role="img"></div>
  </section>

  <section class="panel picker" aria-labelledby="pickTitle">
    <div class="panel-head">
      <h2 class="panel-title" id="pickTitle">Choose a workout</h2>
    </div>
    <div id="workoutList" role="radiogroup" aria-labelledby="pickTitle"></div>
  </section>

  <button class="start" id="start"><span id="startLabel">Start</span><span class="start-time" id="startTime"></span></button>
</main>

<!-- ================= SESSION ================= -->
<main class="screen session" id="session" hidden>
  <header class="top">
    <button class="close" id="close" aria-label="End workout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      <span>End workout</span>
    </button>
    <div id="round">Round 1 of 2</div>
    <div class="spacer"></div>
    <div class="total"><b id="total">0:00</b><span id="totalLabel">left</span></div>
  </header>

  <div class="segments" id="segments" aria-hidden="true"></div>

  <section class="stage" aria-live="polite">
    <p class="phase" id="phase">Get ready</p>
    <h2 class="name" id="name"></h2>

    <svg class="figure" id="fig" viewBox="20 42 220 106" aria-hidden="true">
      <line class="ground" x1="28" y1="141" x2="232" y2="141"/>
      <g id="person">
        <g class="far" id="far">
          <line class="limb" id="fUA"/><line class="limb" id="fFA"/>
          <line class="limb" id="fTH"/><line class="limb" id="fSH"/>
        </g>
        <line class="torso" id="torso"/>
        <circle id="head" r="10"/>
        <g><line class="limb" id="nTH"/><line class="limb" id="nSH"/></g>
        <g id="nearArms"><line class="limb" id="nUA"/><line class="limb" id="nFA"/></g>
      </g>
    </svg>

    <div class="clock" id="clock">
      <svg viewBox="0 0 120 120" aria-hidden="true">
        <circle class="ring-track" cx="60" cy="60" r="54"/>
        <circle class="ring-bar" id="ring" cx="60" cy="60" r="54"/>
      </svg>
      <div class="dial">
        <span class="dial-side" id="dialSide"></span>
        <span class="num" id="num"></span>
        <span class="dial-sub" id="dialSub"></span>
      </div>
    </div>

    <p class="next" id="next"></p>
    <button class="tempo" id="tempo" aria-pressed="true" hidden><i></i><span id="tempoLabel">Tempo on</span></button>
  </section>

  <nav class="controls">
    <button class="icon" id="left" aria-label="Restart workout"></button>
    <button class="go" id="go">Stop</button>
    <button class="icon" id="sound" aria-label="Sound on" aria-pressed="true"></button>
  </nav>
</main>

<script>
(function(){
  "use strict";
  // ================= Geometry =================
  const G = 136, TH = 38, SH = 38, TO = 62, UA = 28, FA = 26;
  const DEG = 180 / Math.PI;
  const rad = d => d / DEG;
  const P = (p, a, l) => ({ x: p.x + Math.cos(rad(a)) * l, y: p.y - Math.sin(rad(a)) * l });
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
  const off = (p, dx, dy) => ({ x: p.x + dx, y: p.y + dy });
  const lerp = (a, b, k) => ({ x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k });
  const wave = t => (1 - Math.cos(2 * Math.PI * t)) / 2;
  const sw = t => Math.sin(2 * Math.PI * t);
  function ik(a, b, l1, l2, low){
    const dx = b.x - a.x, dy = b.y - a.y, D = Math.hypot(dx, dy) || 1;
    const ux = dx / D, uy = dy / D, d = Math.min(D, l1 + l2 - 0.001);
    const k = (l1 * l1 - l2 * l2 + d * d) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - k * k));
    const bx = a.x + ux * k, by = a.y + uy * k;
    const c1 = { x: bx - uy * h, y: by + ux * h }, c2 = { x: bx + uy * h, y: by - ux * h };
    return (c1.y < c2.y) !== !!low ? c1 : c2;
  }
  function mirror(p){
    const o = {};
    for (const k in p) o[k] = (p[k] && typeof p[k] === 'object') ? { x: 260 - p[k].x, y: p[k].y } : p[k];
    return o;
  }
  const armsFlat = (x) => ({ eN: { x: x, y: G }, hN: { x: x + 24, y: G }, eF: { x: x + 4, y: G }, hF: { x: x + 28, y: G } });

  // ================= Poses =================
  function plank(t){
    const sag = wave(t) * 2.5, sh = { x: 74, y: G - UA };
    const len = TO + TH + SH, ang = -Math.asin(UA / len) * DEG;
    const fN = P(sh, ang, len), hip = off(P(sh, ang, TO), 0, sag), fF = off(fN, 5, 0);
    return { sh, hip, head: P(sh, 180 + ang + 4, 17),
      eN: { x: 74, y: G }, hN: { x: 48, y: G }, eF: { x: 80, y: G }, hF: { x: 54, y: G },

  function sidePlank(t, flip){
    const lift = wave(t), sh = { x: 66, y: G - 32 };
    const len = TO + TH + SH, ang = -Math.asin(32 / len) * DEG;
    const fN = P(sh, ang, len), hip = off(P(sh, ang, TO), 0, 2 - 5 * lift), fF = off(fN, -1, -8);
    const eF = P(sh, 94, UA), hF = P(eF, 90 + 5 * sw(t), FA);
    const p = { sh, hip, head: P(sh, 180 + ang, 17), eN: { x: 66, y: G }, hN: { x: 58, y: G + 1 }, eF, hF,
      kN: mid(hip, fN), fN, kF: mid(hip, fF), fF, flat: true };
    return flip ? mirror(p) : p;
  }
  function lyingLegs(th){
    const hip = { x: 122, y: G }, kN = P(hip, th, TH), fN = P(kN, th, SH);
    return Object.assign({ sh: { x: 60, y: G }, hip, head: { x: 44, y: G - 4 }, kN, fN, kF: off(kN, 3, 0), fF: off(fN, 3, 0) }, armsFlat(88));

  function flutter(t){
    const s = sw(t), hip = { x: 122, y: G }, sh = P(hip, 176, TO);
    const kN = P(hip, 16 + 10 * s, TH), fN = P(kN, 16 + 10 * s, SH);
    const kF = P(hip, 16 - 10 * s, TH), fF = P(kF, 16 - 10 * s, SH);
    const eN = P(sh, -4, UA), hN = P(eN, -4, FA);

  function bentLeg(hip, b){

  function elbowKnee(t){
    const s = sw(t), bN = (1 + s) / 2, bF = (1 - s) / 2, hip = { x: 134, y: G };

    async connect(){

        if (!db || !user) return;
        const id = await user.id(); if (!id) return;
        const ref = db.doc('data/users/' + id + '/history');
        const snap = await ref.get();
        const remote = snap.exists ? clean((snap.data() || {}).days) : {};
        const merged = merge(this.days, remote);
        this.ref = ref;
        if (!same(merged, remote)) { try { await ref.set({ days: merged }); } catch (e) {} }

  function stats(days){
    const has = k => (days[k] || 0) > 0;

  function renderHeatmap(force){

    const gap = 3, labelW = 26, target = 14;
    const cols = Math.max(8, Math.min(53, Math.floor((W - labelW) / (target + gap))));
    if (!force && cols === heatCols) return;

    const today = startOfDay(new Date()), tk = dayKey(today);

    for (let c = 0; c < cols; c++){

        const d = addDays(start, c * 7 + r);

        else if (c === 'host_unavailable') noteIn(sub, 'Saving isn’t available in this app. Open it in a browser to export.');
        else if (c === 'rate_limited') noteIn(sub, 'A save is already open. Try again in a moment.');
        else noteIn(sub, 'Export isn’t available here');
      });
    } else if (inClaude){
      noteIn(sub, 'Export isn’t ready yet. Try again in a moment.');
    } else {
      try {
        const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
        const a = document.createElement('a'); a.href = url; a.download = filename;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        noteIn(sub, 'Saved ' + filename);
      } catch (e) { noteIn(sub, 'Export didn’t work on this device'); }
    }
  });
  importBtn.addEventListener('click', () => { importFile.value = ''; importFile.click(); });
  importFile.addEventListener('change', () => {
    const f = importFile.files && importFile.files[0], sub = $('importSub');
    if (!f) return;
    if (f.size > 2e6){ noteIn(sub, 'That file is too large to be a Core export'); return; }
    const r = new FileReader();
    r.onload = () => {
      const found = {};
      String(r.result).split(/\r?\n/).forEach(line => {
        const m = line.trim().match(/^"?(\d{4}-\d{2}-\d{2})"?\s*[,;\t]\s*"?(\d+)"?/);
        if (m) found[m[1]] = Math.max(found[m[1]] || 0, Number(m[2]));
      });
      const clean_ = clean(found);
      if (!Object.keys(clean_).length){ noteIn(sub, 'That file didn’t look like a Core export'); return; }
      const added = Store.importDays(clean_);
      noteIn(sub, added ? 'Added ' + added + (added === 1 ? ' day' : ' days') : 'Nothing new, you’re up to date');
      popNext = false;
    };
    r.onerror = () => noteIn(sub, 'Couldn’t read that file');
    r.readAsText(f);
  });

  // ================= Session DOM =================
  const els = { round: $('round'), total: $('total'), totalLabel: $('totalLabel'), phase: $('phase'), name: $('name'),
    num: $('num'), side: $('dialSide'), sub: $('dialSub'), next: $('next'), ring: $('ring'), clock: $('clock'),
    go: $('go'), left: $('left'), sound: $('sound'), far: $('far'), nearArms: $('nearArms'), close: $('close'),
    tempo: $('tempo'), tempoLabel: $('tempoLabel') };
  const limbs = {}; ['fUA','fFA','fTH','fSH','nUA','nFA','nTH','nSH','torso'].forEach(k => limbs[k] = $(k));
  const headEl = $('head');
  const C = 2 * Math.PI * 54;
  function L(el, a, b){
    el.setAttribute('x1', a.x.toFixed(1)); el.setAttribute('y1', a.y.toFixed(1));
    el.setAttribute('x2', b.x.toFixed(1)); el.setAttribute('y2', b.y.toFixed(1));
  }
  function draw(p){
    L(limbs.fUA, p.sh, p.eF); L(limbs.fFA, p.eF, p.hF);
    L(limbs.fTH, p.hip, p.kF); L(limbs.fSH, p.kF, p.fF);
    L(limbs.torso, p.sh, p.hip);
    headEl.setAttribute('cx', p.head.x.toFixed(1)); headEl.setAttribute('cy', p.head.y.toFixed(1));
    L(limbs.nTH, p.hip, p.kN); L(limbs.nSH, p.kN, p.fN);
    L(limbs.nUA, p.sh, p.eN); L(limbs.nFA, p.eN, p.hN);
    els.far.style.opacity = p.flat ? '1' : '';
    els.nearArms.style.opacity = p.armsDim ? (1 - 0.64 * p.armsDim).toFixed(2) : '';
  }
  const ICON = {
    reset: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.2"/><rect x="14" y="5" width="4" height="14" rx="1.2"/></svg>',
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
    on: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
    off: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 6 6"/><path d="m22 9-6 6"/></svg>'
  };

  // ================= Sound, vibration, screen =================
  let actx = null, soundOn = lsGet('core.sound') !== 'off', tempoOn = lsGet('core.tempo') !== 'off';
  function initAudio(){
    try {
      if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
      if (actx && actx.state === 'suspended') actx.resume();
    } catch (e) {}
  }
  function beep(f, d, vol){
    if (!soundOn || !actx) return;
    try {
      const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (d || 0.12));
      o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + (d || 0.12) + 0.03);
    } catch (e) {}
  }
  const vib = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };
  function paintSound(){
    els.sound.innerHTML = soundOn ? ICON.on : ICON.off;
    els.sound.setAttribute('aria-pressed', String(soundOn));
    els.sound.setAttribute('aria-label', soundOn ? 'Sound on' : 'Sound off');
  }
  function paintTempo(){
    els.tempo.setAttribute('aria-pressed', String(tempoOn));
    setText(els.tempoLabel, tempoOn ? 'Tempo on' : 'Tempo off');
  }
  paintSound(); paintTempo();
  let wl = null;
  async function lockOn(){ try { if ('wakeLock' in navigator) wl = await navigator.wakeLock.request('screen'); } catch (e) {} }
  function lockOff(){ try { if (wl) wl.release(); } catch (e) {} wl = null; }

  // ================= Session engine =================
  let W = null, STEPS = [], WORK_IDX = [];
  let si = 0, sEl = 0, tEl = 0, running = false, done = false, anim = 0, repBase = 0;
  let lastSec = -1, lastBeats = 0, closeArmed = false, closeTimer = null, leftKey = '';

  function build(w){
    W = w; STEPS = []; WORK_IDX = [];
    for (let r = 0; r < w.rounds; r++) w.items.forEach((it, i) => {
      STEPS.push({ type: 'rest', it, i, round: r, dur: w.rest });
      WORK_IDX.push(STEPS.length);
      STEPS.push({ type: 'work', it, i, round: r, dur: it.time || null });
    });
    const seg = $('segments'); seg.innerHTML = '';
    WORK_IDX.forEach((_, j) => {
      const d = document.createElement('div'); d.className = 'seg' + (j === w.items.length ? ' break' : '');
      d.appendChild(document.createElement('i')); seg.appendChild(d);
    });
    els.tempo.hidden = w.timed;
    els.clock.classList.toggle('reps', !w.timed);
    setText(els.totalLabel, w.timed ? 'left' : 'elapsed');
  }
  const beatsTotal = it => it.reps * (it.sides ? 2 : 1);
  const beatsDone = (st) => Math.min(beatsTotal(st.it), Math.floor(Math.max(0, sEl - repBase) / st.it.pace));
  function stepStart(){
    const st = STEPS[si];
    sEl = 0; repBase = 0; lastBeats = 0; anim = 0;
    lastSec = st.dur ? Math.ceil(st.dur) : -1;
    if (st.type === 'work'){ beep(880, 0.35, 0.22); vib(150); } else beep(587, 0.15, 0.16);
  }
  function advance(){
    si++;
    if (si >= STEPS.length){ si = STEPS.length - 1; finish(); return; }
    stepStart();
  }
  function finish(){
    running = false; done = true; lockOff(); vib([120, 80, 120]);
    [660, 784, 988].forEach((f, k) => setTimeout(() => beep(f, 0.2, 0.2), k * 180));
    Store.add(dayKey(new Date()));
    popNext = true;
  }
  function reset(){ si = 0; sEl = 0; tEl = 0; running = false; done = false; anim = 0; lockOff(); }
  function begin(){ reset(); running = true; lockOn(); stepStart(); }

  function tick(dt){
    if (!running || done) return;
    sEl += dt; tEl += dt;
    let st = STEPS[si];
    while (running && !done && st.dur != null && sEl >= st.dur){
      const carry = sEl - st.dur; advance(); if (done) return; sEl = carry; st = STEPS[si];
    }
    if (st.dur != null){
      const sec = Math.ceil(st.dur - sEl - 1e-6);
      if (sec !== lastSec){
        lastSec = sec;
        if (st.type === 'rest' || (sec <= 3 && sec > 0)) beep(st.type === 'rest' ? 587 : 660, 0.1, 0.14);
      }
    } else if (tempoOn){
      const b = beatsDone(st), total = beatsTotal(st.it);
      if (b > lastBeats){
        lastBeats = b;
        if (b >= total){ beep(784, 0.16, 0.2); setTimeout(() => beep(988, 0.24, 0.2), 150); vib(80); }
        else beep(st.it.sides ? (b % 2 ? 740 : 600) : 700, 0.07, 0.13);
        pulse();
      }
    }
  }
  function pulse(){
    [els.clock, els.tempo].forEach(el => { el.classList.remove('beat'); void el.offsetWidth; el.classList.add('beat'); });
  }

  function renderSession(dt){
    const st = STEPS[si], it = st.it, ex = EX[it.ex];
    const isWork = st.type === 'work', isReps = isWork && st.dur == null;
    document.body.classList.toggle('rest', !done && st.type === 'rest');
    document.body.classList.toggle('paused', !running && !done);

    let phase, name, num, frac, next, side = '', sub = '';
    const n = W.items.length;
    if (done){
      const s = stats(Store.days), streak = s.cur + (s.cur === 1 ? ' day' : ' days') + ' in a row';
      phase = 'Two rounds complete'; name = 'Workout done'; num = '✓'; frac = 1;
      next = W.timed ? streak : 'Finished in ' + fmtUp(tEl) + ', ' + streak;
    } else {
      name = ex.name;
      if (!isWork){
        phase = running ? 'Get ready' : 'Paused';
        num = String(Math.max(1, Math.ceil(st.dur - sEl - 1e-6))); frac = Math.max(0, st.dur - sEl) / st.dur;
        next = it.time ? (it.time >= 60 ? (it.time / 60) + (it.time === 60 ? ' minute' : ' minutes') : it.time + ' seconds')
          : it.reps + (it.sides ? ' each side' : ' reps');
      } else {
        phase = running ? 'Exercise ' + (st.i + 1) + ' of ' + n : 'Paused';
        const nx = STEPS[si + 2];
        next = !nx ? 'Last one' : (nx.round !== st.round ? 'Then round 2, from the top' : 'Then ' + lowerFirst(EX[nx.it.ex].name));
        if (!isReps){
          num = String(Math.max(1, Math.ceil(st.dur - sEl - 1e-6))); frac = Math.max(0, st.dur - sEl) / st.dur;
        } else if (tempoOn){
          const b = beatsDone(st), total = beatsTotal(it), complete = b >= total;
          num = String(it.sides ? Math.floor(b / 2) : b); frac = b / total;
          side = complete ? 'Done' : it.sides ? (b % 2 ? 'Right' : 'Left') : '';
          sub = complete ? 'Tap Next' : 'of ' + it.reps + (it.sides ? ' each side' : '');
        } else {
          num = String(it.reps); frac = 0; sub = it.sides ? 'each side' : 'reps';
        }
      }
    }
    setText(els.round, 'Round ' + (st.round + 1) + ' of ' + W.rounds);
    setText(els.phase, phase); setText(els.name, name); setText(els.num, num);
    setText(els.side, side); setText(els.sub, sub); setText(els.next, next);
    setText(els.total, W.timed ? fmt(done ? 0 : W.total - tEl) : fmtUp(tEl));
    els.ring.style.strokeDashoffset = (C * (1 - frac)).toFixed(2);

    const fills = $('segments').querySelectorAll('i');
    WORK_IDX.forEach((idx, j) => {
      let f = 0;
      if (done || idx < si) f = 1;
      else if (idx === si){
        const s2 = STEPS[idx];
        f = s2.dur != null ? Math.min(1, sEl / s2.dur) : (tempoOn ? beatsDone(s2) / beatsTotal(s2.it) : 0);
      }
      fills[j].style.transform = 'scaleX(' + f.toFixed(4) + ')';
    });

    let pose;
    if (done) pose = crunch(0);
    else if (!isWork) pose = ex.pose(0);
    else if (isReps && tempoOn) pose = ex.pose((Math.max(0, sEl - repBase) / (it.pace * (it.sides ? 2 : 1))) % 1);
    else { if (running) anim += Math.min(dt, 0.1); pose = ex.pose((anim / ex.period) % 1); }
    draw(pose);

    let label;
    if (done) label = 'Home';
    else if (W.timed) label = running ? 'Stop' : 'Go';
    else label = (si === STEPS.length - 1) ? 'Finish' : 'Next';
    setText(els.go, label);
    els.go.classList.toggle('stop', W.timed && running && !done);

    els.tempo.hidden = W.timed || done;
    els.left.style.visibility = (!W.timed && done) ? 'hidden' : '';
    const lk = W.timed ? 'reset' : (running && !done ? 'pause' : 'play');
    if (lk !== leftKey){
      leftKey = lk; els.left.innerHTML = ICON[lk];
      els.left.setAttribute('aria-label', lk === 'reset' ? 'Restart workout' : lk === 'pause' ? 'Pause' : 'Resume');
    }
  }

  let last = performance.now();
  function loop(now){
    const dt = Math.max(0, (now - last) / 1000); last = now;
    tick(dt);
    if (!session.hidden && W) renderSession(dt);
    requestAnimationFrame(loop);
  }

  // ================= Navigation & controls =================
  function goHome(){
    disarmClose(); openMenu(false); reset();
    document.body.classList.remove('rest', 'paused');
    session.hidden = true; home.hidden = false;
    const bump = popNext;
    renderHome();
    if (bump){ const s = $('streakNum'); s.classList.remove('bump'); void s.offsetWidth; s.classList.add('bump'); }
    window.scrollTo(0, 0);
  }
  function startWorkout(){
    openMenu(false); initAudio();
    build(selected());
    home.hidden = true; session.hidden = false;
    begin();
  }
  function mainAction(){
    initAudio();
    if (done){ goHome(); return; }
    if (W.timed){
      if (running){ running = false; lockOff(); } else { running = true; lockOn(); }
    } else {
      if (!running){ running = true; lockOn(); }
      if (si === STEPS.length - 1){ finish(); return; }
      advance();
    }
  }
  function disarmClose(){ closeArmed = false; clearTimeout(closeTimer); els.close.classList.remove('armed'); }

  $('start').addEventListener('click', startWorkout);
  els.go.addEventListener('click', mainAction);
  els.left.addEventListener('click', () => {
    initAudio();
    if (W.timed){ begin(); return; }
    if (done) return;
    if (running){ running = false; lockOff(); } else { running = true; lockOn(); }
  });
  els.close.addEventListener('click', () => {
    if (!done && !closeArmed && (tEl > 0 || running)){
      closeArmed = true; els.close.classList.add('armed');
      closeTimer = setTimeout(disarmClose, 2600); return;
    }
    goHome();
  });
  els.sound.addEventListener('click', () => {
    soundOn = !soundOn; initAudio(); paintSound(); lsSet('core.sound', soundOn ? 'on' : 'off');
    if (soundOn) beep(660, 0.08, 0.12);
  });
  els.tempo.addEventListener('click', () => {
    tempoOn = !tempoOn; paintTempo(); lsSet('core.tempo', tempoOn ? 'on' : 'off');
    if (tempoOn){ repBase = sEl; lastBeats = 0; }
  });
  document.addEventListener('keydown', e => {
    if (e.code === 'Space' && e.target === document.body && !session.hidden){ e.preventDefault(); mainAction(); }
  });
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible'){
      if (running) lockOn();
      if (!home.hidden) renderHome();
    }
  });

  // ================= Boot =================
  Store.load();
  renderHome();
  Store.connect();
  requestAnimationFrame(loop);
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
}
</script>
</body>
